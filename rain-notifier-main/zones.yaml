# Klang Valley Rain Notifier — zones + thresholds config.
#
# Zone membership source of truth: data/zones.csv (loaded by scripts/import_zones.py).
# Sample points are seeded from CSV addresses by that script; the centroid below is only
# a fallback for a zone with no usable CSV rows.

timezone: Asia/Kuala_Lumpur

# CSV label -> official zone name. Only obvious mappings live here; the importer also
# auto-maps (a) case-insensitive exact matches and (b) labels contained in exactly one
# official zone name. Everything else is reported as unmapped — add aliases here yourself.
aliases:
  Kd: Kota Damansara
  Pj: Petaling Jaya

thresholds:
  watch_probability_pct: 60   # WATCH: >= 60% rain chance within watch_horizon_hours
  watch_horizon_hours: 2
  raining_mm_h: 0.5           # RAINING: any sample point >= 0.5 mm/h
  heavy_mm_h: 7.5             # HEAVY: any sample point >= 7.5 mm/h (or MET heavy rain warning)
  clearing_mm_h: 0.1          # below this counts as "dry"
  clearing_minutes: 30        # dry this long while RAINING/HEAVY -> CLEARING
  confirm_readings: 2         # consecutive readings required to enter RAINING/HEAVY
  stale_gap_minutes: 20       # dry data gap longer than this restarts the clearing clock
  cooldown_minutes: 30        # no re-alert for the same zone + state within this
  merge_window_minutes: 5     # max time an alert may wait to be merged (spec: 5 min)
  merge_min_zones: 3          # 3+ zone changes in the window -> one combined message
  merge_grace_seconds: 60     # how long a lone alert waits for company before sending
  merge_debounce_seconds: 10  # quiet period before a 3+ batch goes out as one message

# Active hours in MYT; null = always on. Outside them only HEAVY alerts go out.
active_hours: null            # example: {start: "10:00", end: "22:00"}

poll_interval_seconds:
  open_meteo: 600             # 10 min (spec 4B)
  met_warning: 300            # 5 min (spec 4A)

state_colors:
  CLEAR: "#7C3AED"            # purple
  WATCH: "#F59E0B"            # orange
  RAINING: "#EF4444"          # red
  HEAVY: "#7F1D1D"            # dark red
  CLEARING: "#3B82F6"         # blue

# Geocodes outside this box are discarded by the importer (spec 3a).
klang_valley_bbox: {min_lat: 2.85, max_lat: 3.55, min_lon: 101.30, max_lon: 102.10}

# met_districts are real MET Malaysia location names (verified against the live
# /weather/forecast location list during the build). "TODO: verify" items are guesses.
zones:
  - name: Ampang - Gombak
    met_districts: [Ampang, Gombak, "Batu Caves"]
    centroid: [3.2000, 101.7400]
    points: [{name: P1, lat: 3.071583, lon: 101.583066}, {name: P2, lat: 3.172547, lon: 101.743625}, {name: P3, lat: 3.193494, lon: 101.612762}]

